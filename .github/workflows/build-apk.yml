name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time MUSHIN dynamic grid repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/mushamusha/giantfolder/MainActivity.java')
          s=p.read_text()
          if 'import jp.mushamusha.mushinglass.MushinGlass;' not in s:
              s=s.replace('import java.util.Set;\n','import java.util.Set;\n\nimport jp.mushamusha.mushinglass.MushinGlass;\n',1)
          if 'MushinGlass.applyToView(this,grid);' not in s:
              old='''        if(list.isEmpty()){
            TextView empty=text(q.isEmpty()?"ここは空っぽです\\n＋ から追加できます":"見つかりませんでした",16,0xFFEFEFF5);empty.setGravity(Gravity.CENTER);
            int cols=Math.max(1,grid.getColumnCount());GridLayout.LayoutParams lp=new GridLayout.LayoutParams(GridLayout.spec(0,1f),GridLayout.spec(0,cols,1f));lp.width=0;lp.height=Ui.dp(this,150);grid.addView(empty,lp);
        }
    }

    private void addCell'''
              new='''        if(list.isEmpty()){
            TextView empty=text(q.isEmpty()?"ここは空っぽです\\n＋ から追加できます":"見つかりませんでした",16,0xFFEFEFF5);empty.setGravity(Gravity.CENTER);
            int cols=Math.max(1,grid.getColumnCount());GridLayout.LayoutParams lp=new GridLayout.LayoutParams(GridLayout.spec(0,1f),GridLayout.spec(0,cols,1f));lp.width=0;lp.height=Ui.dp(this,150);grid.addView(empty,lp);
        }
        MushinGlass.applyToView(this,grid);
    }

    private void addCell'''
              if old not in s: raise SystemExit('refreshGrid anchor missing')
              s=s.replace(old,new,1)
          s=s.replace('TextView star=text("★",15,0xFFFFE082);star.setGravity(Gravity.CENTER);','TextView star=text("★",15,0xFFFFE082);star.setTag("keep_text_color");star.setGravity(Gravity.CENTER);',1)
          s=s.replace('TextView n=text("NEW",9,Color.WHITE);n.setGravity(Gravity.CENTER);','TextView n=text("NEW",9,Color.WHITE);n.setTag("keep_text_color");n.setGravity(Gravity.CENTER);',1)
          s=s.replace('TextView badge=text(numeric?(count>99?"99+":String.valueOf(count)):"●",numeric?10:11,Color.WHITE);','TextView badge=text(numeric?(count>99?"99+":String.valueOf(count)):"●",numeric?10:11,Color.WHITE);badge.setTag("keep_text_color");',1)
          if 'MushinGlass.applyToView(this,dock);' not in s:
              old='''        boolean compact=compactUi();for(ItemModel m:list){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setGravity(Gravity.CENTER);ImageView iv=new ImageView(this);iv.setImageDrawable(iconFor(m));TextView tv=text(m.name,compact?9:10,Color.WHITE);tv.setGravity(Gravity.CENTER);tv.setSingleLine(true);int icon=compact?30:34;c.addView(iv,new LinearLayout.LayoutParams(Ui.dp(this,icon),Ui.dp(this,icon)));c.addView(tv,new LinearLayout.LayoutParams(-1,Ui.dp(this,compact?16:18)));c.setOnClickListener(v->requestLaunch(m));c.setOnLongClickListener(v->{new AlertDialog.Builder(this).setTitle("ドックから外しますか？").setMessage(m.name).setPositiveButton("外す",(d,w)->{store.deleteRecursive(m.id);refreshDock();}).setNegativeButton("キャンセル",null).show();return true;});dock.addView(c,new LinearLayout.LayoutParams(0,-1,1));}
    }

    private void toggleEditMode'''
              new='''        boolean compact=compactUi();for(ItemModel m:list){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setGravity(Gravity.CENTER);ImageView iv=new ImageView(this);iv.setImageDrawable(iconFor(m));TextView tv=text(m.name,compact?9:10,Color.WHITE);tv.setGravity(Gravity.CENTER);tv.setSingleLine(true);int icon=compact?30:34;c.addView(iv,new LinearLayout.LayoutParams(Ui.dp(this,icon),Ui.dp(this,icon)));c.addView(tv,new LinearLayout.LayoutParams(-1,Ui.dp(this,compact?16:18)));c.setOnClickListener(v->requestLaunch(m));c.setOnLongClickListener(v->{new AlertDialog.Builder(this).setTitle("ドックから外しますか？").setMessage(m.name).setPositiveButton("外す",(d,w)->{store.deleteRecursive(m.id);refreshDock();}).setNegativeButton("キャンセル",null).show();return true;});dock.addView(c,new LinearLayout.LayoutParams(0,-1,1));}
        MushinGlass.applyToView(this,dock);
    }

    private void toggleEditMode'''
              if old not in s: raise SystemExit('refreshDock anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f MUSHIN_DYNAMIC_GRID_TRIGGER .github/workflows/oneoff-mushin-dynamic-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/mushamusha/giantfolder/MainActivity.java MUSHIN_DYNAMIC_GRID_TRIGGER .github/workflows/oneoff-mushin-dynamic-grid.yml 2>/dev/null || git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Apply MUSHIN settings to rebuilt folder grids'
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiantFolder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
