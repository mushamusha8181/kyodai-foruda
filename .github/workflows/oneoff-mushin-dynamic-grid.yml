name: One-off MUSHIN dynamic grid patch

on:
  push:
    paths:
      - 'MUSHIN_DYNAMIC_GRID_TRIGGER'
      - '.github/workflows/oneoff-mushin-dynamic-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Style rebuilt grid and dock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/mushamusha/giantfolder/MainActivity.java')
          s=p.read_text()
          anchor='import java.util.Set;\n'
          if 'import jp.mushamusha.mushinglass.MushinGlass;' not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor,anchor+'\nimport jp.mushamusha.mushinglass.MushinGlass;\n',1)
          grid_end='''        if(list.isEmpty()){
            TextView empty=text(q.isEmpty()?"ここは空っぽです\\n＋ から追加できます":"見つかりませんでした",16,0xFFEFEFF5);empty.setGravity(Gravity.CENTER);
            int cols=Math.max(1,grid.getColumnCount());GridLayout.LayoutParams lp=new GridLayout.LayoutParams(GridLayout.spec(0,1f),GridLayout.spec(0,cols,1f));lp.width=0;lp.height=Ui.dp(this,150);grid.addView(empty,lp);
        }
    }'''
          if grid_end not in s: raise SystemExit('refreshGrid end anchor missing')
          s=s.replace(grid_end,grid_end[:-6]+'        MushinGlass.applyToView(this,grid);\n    }',1)
          s=s.replace('TextView star=text("★",15,0xFFFFE082);star.setGravity(Gravity.CENTER);','TextView star=text("★",15,0xFFFFE082);star.setTag("keep_text_color");star.setGravity(Gravity.CENTER);',1)
          s=s.replace('TextView n=text("NEW",9,Color.WHITE);n.setGravity(Gravity.CENTER);','TextView n=text("NEW",9,Color.WHITE);n.setTag("keep_text_color");n.setGravity(Gravity.CENTER);',1)
          s=s.replace('TextView badge=text(numeric?(count>99?"99+":String.valueOf(count)):"●",numeric?10:11,Color.WHITE);','TextView badge=text(numeric?(count>99?"99+":String.valueOf(count)):"●",numeric?10:11,Color.WHITE);badge.setTag("keep_text_color");',1)
          dock_tail='''        boolean compact=compactUi();for(ItemModel m:list){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setGravity(Gravity.CENTER);ImageView iv=new ImageView(this);iv.setImageDrawable(iconFor(m));TextView tv=text(m.name,compact?9:10,Color.WHITE);tv.setGravity(Gravity.CENTER);tv.setSingleLine(true);int icon=compact?30:34;c.addView(iv,new LinearLayout.LayoutParams(Ui.dp(this,icon),Ui.dp(this,icon)));c.addView(tv,new LinearLayout.LayoutParams(-1,Ui.dp(this,compact?16:18)));c.setOnClickListener(v->requestLaunch(m));c.setOnLongClickListener(v->{new AlertDialog.Builder(this).setTitle("ドックから外しますか？").setMessage(m.name).setPositiveButton("外す",(d,w)->{store.deleteRecursive(m.id);refreshDock();}).setNegativeButton("キャンセル",null).show();return true;});dock.addView(c,new LinearLayout.LayoutParams(0,-1,1));}
    }'''
          if dock_tail not in s: raise SystemExit('refreshDock anchor missing')
          s=s.replace(dock_tail,dock_tail[:-6]+'        MushinGlass.applyToView(this,dock);\n    }',1)
          p.write_text(s)
          PY
          rm -f MUSHIN_DYNAMIC_GRID_TRIGGER .github/workflows/oneoff-mushin-dynamic-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply MUSHIN settings to rebuilt folder grids'
          git push
