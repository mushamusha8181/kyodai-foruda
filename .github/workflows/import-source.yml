name: Import GiantFolder source

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 0 40); do
            printf -v f '.import2/part_%03d.b64' "$i"
            test -f "$f"
            tr -d '\n\r\t ' < "$f" | base64 --decode >/dev/null
          done
          for f in .import2/final_0.b64 .import2/final_1.b64 .import2/final_2.b64; do
            test -f "$f"
            tr -d '\n\r\t ' < "$f" | base64 --decode >/dev/null
          done
          {
            for i in $(seq 0 40); do
              printf -v f '.import2/part_%03d.b64' "$i"
              cat "$f"
            done
            cat .import2/final_0.b64 .import2/final_1.b64 .import2/final_2.b64
          } | tr -d '\n\r\t ' | base64 --decode > /tmp/GiantFolder-v0.13-source.zip
          echo "bcbcfd2205a044b262b3dcc233d75868e7b71c82d46986d0413a1d324b2816b8  /tmp/GiantFolder-v0.13-source.zip" | sha256sum -c -
          unzip -t /tmp/GiantFolder-v0.13-source.zip

      - name: Replace repository with exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/giantfolder-import
          mkdir -p /tmp/giantfolder-import
          unzip -q /tmp/GiantFolder-v0.13-source.zip -d /tmp/giantfolder-import
          SRC=/tmp/giantfolder-import/GiantFolder-v0.13
          test -d "$SRC/app/src/main"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='.import2' \
            --exclude='.github/workflows/import-source.yml' \
            "$SRC/" ./
          diff -qr \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='.import2' \
            --exclude='import-source.yml' \
            "$SRC" .
          rm -rf .import .import2
          rm -f .github/workflows/import-source.yml
          chmod +x build_debug_apk.command || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import GiantFolder v0.13 source"
          git push origin HEAD:main
