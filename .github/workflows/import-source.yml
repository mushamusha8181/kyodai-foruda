name: Import GiantFolder source

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .import2 -maxdepth 1 -type f -name 'part_*.b64' | wc -l)" -eq 42
          while IFS= read -r f; do
            cleaned="$(tr -d '\n\r\t ' < "$f")"
            printf '%s' "$cleaned" | base64 --decode >/dev/null || { echo "BAD_BASE64_FILE=$f"; echo "LENGTH=${#cleaned}"; exit 1; }
          done < <(find .import2 -maxdepth 1 -type f -name 'part_*.b64' | sort)
          find .import2 -maxdepth 1 -type f -name 'part_*.b64' -print0 | sort -z | xargs -0 cat | tr -d '\n\r\t ' | base64 --decode > /tmp/GiantFolder-v0.13-source.zip
          echo "bcbcfd2205a044b262b3dcc233d75868e7b71c82d46986d0413a1d324b2816b8  /tmp/GiantFolder-v0.13-source.zip" | sha256sum -c -
          unzip -t /tmp/GiantFolder-v0.13-source.zip

      - name: Replace repository with exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/giantfolder-import
          mkdir -p /tmp/giantfolder-import
          unzip -q /tmp/GiantFolder-v0.13-source.zip -d /tmp/giantfolder-import
          SRC=/tmp/giantfolder-import/GiantFolder-v0.13
          test -d "$SRC/app/src/main"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='.import2' \
            --exclude='.github/workflows/import-source.yml' \
            "$SRC/" ./
          diff -qr \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='.import2' \
            --exclude='import-source.yml' \
            "$SRC" .
          rm -rf .import .import2
          rm -f .github/workflows/import-source.yml
          chmod +x build_debug_apk.command || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import GiantFolder v0.13 source"
          git push origin HEAD:main
